services:
  # Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env

    container_name: video-api

    ports:
      - "3000:3000"

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - video_data:/app/upload-s3
      - output_data:/app/processed-video-s3

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["node", "dist/workers/video.worker.js"]

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - video_data:/app/upload-s3
      - output_data:/app/processed-video-s3

    restart: unless-stopped

  # Redis queue
  redis:
    image: redis:7-alpine

    container_name: my-redis

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  video_data:
  output_data:
  redis_data:
